[project]
name = "jev-playground"
version = "0.1.0"
description = "Batch support-ticket severity and category classification API (FastAPI + OpenJev)"
readme = "README.md"
authors = [
    { name = "Alvin Paul L. Azurin", email = "alvin_azurin@yahoo.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "openjev[hf]>=0.1.0",
    "pydantic-settings>=2.15.0",
    "torch>=2.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv.sources]
openjev = { path = "../../tools/OpenJev", editable = true }
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[project.scripts]
jev-playground = "jev_playground:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Tests are checked, but do not need annotations on every function.
module = ["tests", "tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
# OpenJev ships no py.typed marker, so its types are unknown to mypy.
module = ["openjev", "openjev.*"]
ignore_missing_imports = true
